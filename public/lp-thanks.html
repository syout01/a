<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>送信ありがとうございます | DigLead</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
  :root{--bg:#F3F5F8;--panel:#fff;--ink:#101828;--muted:#5B6472;--line:#DCE1E9;--accent:#1F4FD8}
  @media (prefers-color-scheme:dark){:root{--bg:#0C1017;--panel:#141A24;--ink:#E7EAF0;--muted:#98A1B0;--line:#28303E;--accent:#7B9BFF}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",-apple-system,"Hiragino Sans",Meiryo,sans-serif;line-height:1.85}
  .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px 32px;max-width:560px;width:100%}
  h1{font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;font-size:26px;margin:0 0 12px;line-height:1.35}
  p{margin:0 0 12px;color:var(--muted)}
  .logo{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:900;font-size:18px;margin-bottom:18px}
  a.btn{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="logo">DigLead</div>
  <h1>ご相談ありがとうございます。<br>1 営業日以内にご連絡します。</h1>
  <p>担当より、ご入力いただいたメールアドレスまたは電話番号へご連絡します。展示会の日程が近い場合は、その旨を返信いただければ優先して対応します。</p>
  <p>株式会社SynapseWork　DigLead 担当</p>
  <a class="btn" href="/lp.html">ページに戻る</a>
</div></div>
</body>
</html>
